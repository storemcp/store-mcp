name: PHPCS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: cs2pr

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHPCS + WPCS + PHPCompatibilityWP
        run: |
          composer global require --dev --no-progress --no-interaction \
            "squizlabs/php_codesniffer=^3.9" \
            "wp-coding-standards/wpcs=^3" \
            "phpcsstandards/phpcsextra=^1" \
            "phpcsstandards/phpcsutils=^1" \
            "phpcompatibility/phpcompatibility-wp=^2"
          echo "$HOME/.composer/vendor/bin" >> $GITHUB_PATH

      - name: Register external standards with PHPCS
        run: |
          phpcs --config-set installed_paths \
            "$HOME/.composer/vendor/wp-coding-standards/wpcs,$HOME/.composer/vendor/phpcsstandards/phpcsextra,$HOME/.composer/vendor/phpcsstandards/phpcsutils,$HOME/.composer/vendor/phpcompatibility/php-compatibility,$HOME/.composer/vendor/phpcompatibility/phpcompatibility-paragonie,$HOME/.composer/vendor/phpcompatibility/phpcompatibility-wp"
          phpcs -i

      - name: Run PHPCS
        run: phpcs -q --report=checkstyle --standard=phpcs.xml.dist | cs2pr
